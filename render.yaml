# Render Blueprint: free web service + free PostgreSQL.
# Render dashboard → New → Blueprint → pick this repo. You'll be asked for ADMIN_PHONE / ADMIN_PASSWORD.
services:
  - type: web
    name: nowgong-mart
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /up
    envVars:
      - key: APP_NAME
        value: Nowgong Mart
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        value: https://nowgong-mart.onrender.com
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        fromDatabase:
          name: nowgong-mart-db
          property: connectionString
      - key: LOG_CHANNEL
        value: stderr
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: SEED_DEMO
        value: "true"
      - key: ADMIN_NAME
        value: Store Owner
      - key: ADMIN_PHONE
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

databases:
  - name: nowgong-mart-db
    plan: free
    region: singapore
    databaseName: nowgong_mart
    user: nowgong
