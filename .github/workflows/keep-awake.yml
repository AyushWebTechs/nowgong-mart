# Render's free plan sleeps after 15 idle minutes; a ping every 10 minutes keeps the store warm.
name: Keep site awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS --retry 3 --retry-delay 20 --max-time 120 -o /dev/null -w '%{http_code}\n' https://nowgong-mart.onrender.com/up
